[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quantum-route-core"
version = "0.1.0"
description = "API-first delivery planning with a reusable, independently validated Python core"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
classical = ["ortools>=9.14,<10"]
routing = ["httpx>=0.28,<1", "shapely>=2.1,<3"]
service = ["quantum-route-core[routing]", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "psutil>=7,<8"]
cli = ["typer>=0.16,<1"]
quantum = ["qiskit>=2,<3", "qiskit-aer>=0.17,<1"]

[dependency-groups]
dev = ["quantum-route-core[service,classical,cli]", "pytest>=8.3,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.12,<1", "mypy>=1.15,<2", "types-psutil>=7", "pyyaml>=6,<7"]

[project.scripts]
dev = "quantum_route_core.dev:main"
qroute = "quantum_route_core.cli.main:app"
qroute-worker = "quantum_route_core.jobs.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_route_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicit, quota-limited ORS checks requiring ORS_API_KEY"]
