name: Build and test
on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      # main is updated by an approved PR merge, which creates the tested deploy artifact.
      - main
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.15
      - run: uv sync --frozen --extra service --extra classical --extra cli
      - run: uv run --no-sync ruff check src tests migrations scripts
      - run: uv run --no-sync ruff format --check src tests migrations scripts
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pytest --junitxml=results/junit.xml --cov=quantum_route_core --cov-report=xml:results/coverage.xml
      - run: uv build
      - name: Verify minimal wheel installation
        shell: bash
        run: |
          uv venv .core-test
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.core-test/Scripts/python.exe; else PY=.core-test/bin/python; fi
          uv pip install --python "$PY" dist/*.whl
          "$PY" -c "from quantum_route_core.public import solve; import importlib.util; assert importlib.util.find_spec('fastapi') is None; assert importlib.util.find_spec('ortools') is None"
          "$PY" examples/python/solve_instance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: results/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build tested image
        run: docker build -f deploy/Dockerfile -t quantum-route-core:tested .
      - name: Exercise API and worker in Compose
        env:
          QROUTE_IMAGE: quantum-route-core:tested
        run: |
          cp .env.example .env
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN"
          echo "QROUTE_AUTH_TOKENS={\"ci\":\"$TOKEN\"}" >> .env
          echo "QROUTE_SMOKE_TOKEN=$TOKEN" >> .env
          docker compose -f deploy/compose.yaml up -d --wait api worker
          docker compose -f deploy/compose.yaml exec -T api python scripts/smoke.py
      - name: Save immutable release input
        run: |
          mkdir -p release
          docker save quantum-route-core:tested -o release/image.tar
          printf '%s' "$GITHUB_SHA" > release/commit.txt
          tar -czf release/deploy-bundle.tar.gz deploy scripts examples alembic.ini migrations
          cd release
          sha256sum image.tar deploy-bundle.tar.gz > checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.sha }}
          path: release/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: docker compose -f deploy/compose.yaml down
  checks:
    if: always()
    needs: [quality, container]
    runs-on: ubuntu-latest
    steps:
      - env:
          QUALITY: ${{ needs.quality.result }}
          CONTAINER: ${{ needs.container.result }}
        run: test "$QUALITY" = success && test "$CONTAINER" = success
  create-pr:
    needs: checks
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: create-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = context.payload.repository.default_branch;
            const branch = await github.rest.repos.getBranch({owner,repo,branch:head});
            if (branch.data.commit.sha !== context.sha) return;
            const existing = await github.rest.pulls.list({owner,repo,head:`${owner}:${head}`,base,state:'open'});
            if (existing.data.length) return;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:`${base}...${head}`});
            if (!comparison.data.ahead_by || !comparison.data.files?.length) return;
            await github.rest.pulls.create({owner,repo,head,base,draft:true,
              title:`Review ${head}`,body:`Build and tests passed for ${context.sha}. Review the changes before merging.\n\nCI: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`});
